teleop_twist_joy_node:
  ros__parameters:
    # --- 軸(Axis)の設定 ---
    # 左スティック(Left Stick): 前後(1), 左右(0)
    axis_linear: {x: 1, y: 0, z: 4}
    
    # 右スティック(Right Stick): 回転(3)
    # ※L2/R2での旋回は標準パッケージで非対応のため、右スティックを使用します
    axis_angular: {yaw: 3}
    
    # --- 速度スケール (0.0 ~ 1.0) ---
    # 元のXMLは0.05ですが、今回のドライバはPWM制御なので
    # ここは「1.0」にして、Launchファイルの 'pwm_limit' で最高速度を調整するのが正解です。
    scale_linear: {x: 1.0, y: -1.0, z: 1.0}
    scale_angular: {yaw: 1.0}
    
      # --- 安全装置ボタン ---
    # ボタン4 (L1ボタン) を押している間だけ動きます
    enable_button: 4
